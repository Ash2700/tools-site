<!--meta
{"title": "分帳計算機", "description": "聚餐、旅遊分攤費用：輸入總金額、人數與服務費，算出每人要付多少，可選擇進位到整數或十元。", "category": "日常", "order": 65}
-->
<div class="panel">
  <div class="row">
    <div><label for="total">總金額（元）</label><input id="total" type="number" inputmode="decimal" value="3680"></div>
    <div><label for="people">人數</label><input id="people" type="number" inputmode="numeric" value="5" min="1"></div>
  </div>
  <div class="row">
    <div><label for="svc">服務費（%）</label><input id="svc" type="number" inputmode="decimal" value="10"></div>
    <div><label for="round">每人金額進位到</label><select id="round"><option value="1">1 元</option><option value="10" selected>10 元</option><option value="50">50 元</option><option value="100">100 元</option></select></div>
  </div>
  <div class="result" id="out"></div>
</div>
<section class="explain">
  <h2>說明</h2>
  <p>每人金額會無條件進位，避免最後收不夠；多收的差額會顯示出來，可以當作公基金或退給付款的人。</p>
</section>
<script>
function calc() {
  const t = num("total"), p = Math.round(num("people")), s = num("svc") || 0, r = parseInt(document.getElementById("round").value);
  const out = document.getElementById("out");
  if (!(t > 0 && p > 0)) { out.textContent = "請輸入有效的金額與人數"; return; }
  const grand = t * (1 + s / 100), exact = grand / p, each = Math.ceil(exact / r) * r;
  out.innerHTML = `<div>每人付</div><div class="big">${fmt(each)} 元</div><dl>
    <dt>含服務費總額</dt><dd>${fmt(grand)} 元</dd><dt>精確每人</dt><dd>${fmt(exact, 2)} 元</dd>
    <dt>收齊後多出</dt><dd>${fmt(each * p - grand)} 元</dd></dl>`;
}
bindAll(calc);
</script>
